config-version = 2
start-at-login = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

focus-follows-mouse.enabled = true

# Keep numeric workspaces available even when empty, so next/prev is predictable.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

on-focus-changed = ['move-mouse window-lazy-center']

[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 3
outer.right = 3
outer.top = 3
outer.bottom = 3

[mode.main.binding]
cmd-left = 'focus left'
cmd-down = 'focus down'
cmd-up = 'focus up'
cmd-right = 'focus right'

# Move window
cmd-ctrl-left = 'move left'
cmd-ctrl-down = 'move down'
cmd-ctrl-up = 'move up'
cmd-ctrl-right = 'move right'

# Monitor navigation
cmd-shift-left = 'focus-monitor left'
cmd-shift-down = 'focus-monitor down'
cmd-shift-up = 'focus-monitor up'
cmd-shift-right = 'focus-monitor right'

cmd-ctrl-shift-left = 'move-node-to-monitor --focus-follows-window left'
cmd-ctrl-shift-down = 'move-node-to-monitor --focus-follows-window down'
cmd-ctrl-shift-up = 'move-node-to-monitor --focus-follows-window up'
cmd-ctrl-shift-right = 'move-node-to-monitor --focus-follows-window right'

# Workspaces: your primary method, Command + number.
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'

cmd-ctrl-1 = 'move-node-to-workspace 1'
cmd-ctrl-2 = 'move-node-to-workspace 2'
cmd-ctrl-3 = 'move-node-to-workspace 3'
cmd-ctrl-4 = 'move-node-to-workspace 4'
cmd-ctrl-5 = 'move-node-to-workspace 5'
cmd-ctrl-6 = 'move-node-to-workspace 6'
cmd-ctrl-7 = 'move-node-to-workspace 7'
cmd-ctrl-8 = 'move-node-to-workspace 8'
cmd-ctrl-9 = 'move-node-to-workspace 9'

# Relative workspace movement
cmd-u = 'workspace next'
cmd-i = 'workspace prev'
cmd-ctrl-u = 'move-node-to-workspace next'
cmd-ctrl-i = 'move-node-to-workspace prev'

# Fullscreen
cmd-alt-f = 'fullscreen'

# Resize
cmd-minus = 'resize smart -64'
cmd-equal = 'resize smart +64'
cmd-ctrl-minus = 'resize smart -16'
cmd-ctrl-equal = 'resize smart +16'

# Floating toggle
cmd-alt-v = 'layout floating tiling'

# Tree layout manipulation 
cmd-alt-left = 'join-with left'
cmd-alt-down = 'join-with down'
cmd-alt-up = 'join-with up'
cmd-alt-right = 'join-with right'
cmd-alt-b = 'balance-sizes'

cmd-enter = 'exec-and-forget open -na ghostty'
